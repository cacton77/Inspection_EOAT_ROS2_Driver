# camera_ros (pi_camera) parameters — 4056x3040 sensor mode (full resolution).
#
# One file per sensor mode: width/height are paired here with the
# camera_info_url of the calibration derived for that exact resolution.
# Intrinsics do NOT survive a resolution change, so never edit width/height
# without pointing camera_info_url at a matching calibration file.
#
# libcamera serves 4056x3040 from the IMX477 full-resolution readout: the
# complete sensor array, no binning and no crop, so both the full FoV and the
# native pixel scale (1.55 um pitch) are preserved. This is the high-resolution
# imaging mode; it is bandwidth-heavy (~37 MB/frame RGB888, ~10 fps cap) and is
# intended for detail capture rather than high-fps autofocus (use a binned mode
# such as pi_camera_1920x1080.yaml for that).
#
# Select at launch with:
#   ros2 launch inspection_eoat bringup.launch.py \
#       pi_camera_config:=<path to this yaml>
#
pi_camera:
  ros__parameters:
    camera: 0
    width: 4056
    height: 3040
    format: RGB888
    frame_id: eoat_camera_link

    # Pin the RAW readout mode rather than letting libcamera choose. The
    # requested output size alone does NOT determine the sensor mode — the same
    # width/height can be served from different binned/cropped readouts, each
    # with different FoV and therefore different intrinsics. Pinning it is what
    # makes the paired calibration below reproducible.
    # Confirmed by libcamera: "Selected sensor format: 4056x3040-SBGGR12_1X12".
    sensor_mode: "4056:3040"

    # StillCapture role: the RPi pipeline handler allocates far fewer (and it
    # sizes them for one-shot capture) buffers than the default `viewfinder`
    # role. At 4056x3040 RGB888 each output buffer is ~35 MiB, so the default
    # role's buffer set does not fit in the Pi's 64 MiB CMA pool and requests
    # never complete — the sensor streams but no image is ever published.
    # See the CMA note at the bottom of this file.
    role: still

    # Theoretical (uncalibrated) intrinsics for the macro-PS rig at minimum
    # magnification (0.12x). camera_info_manager resolves the package:// URL
    # at runtime. Replace with measured intrinsics once ChArUco calibration
    # is run for this mode.
    camera_info_url: package://inspection_eoat/config/macro_ps_imx477_min_mag_4056x3040.yaml

    # BEST_EFFORT + VOLATILE for image streams, same rationale as the D405 in
    # bringup.launch.py: default RELIABLE stalls the writer on cross-host UDP
    # fragment loss. camera_ros gained per-topic qos_overrides in PR #155
    # (June 2026). Keys are node-name scoped, so they track the `pi_camera`
    # node name set in the launch file.
    qos_overrides:
      /pi_camera/image_raw:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5
      /pi_camera/camera_info:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5

# CMA REQUIREMENT
#   Buffers for this mode come from the kernel CMA pool, which defaults to
#   64 MiB on this Pi (CmaTotal in /proc/meminfo). One 4056x3040 RGB888 buffer
#   is ~35 MiB and the CFE also needs 4056x3040-PC1B raw buffers, so the pool
#   is exhausted before a full buffer set is allocated. The symptom is silent:
#   libcamera logs a clean "configuring streams" and the CSI keeps taking
#   frames (rp1-cfe interrupts increment), but no request ever completes, so
#   /pi_camera/image_raw publishes nothing and CmaFree sits near zero.
#
#   `role: still` above is the no-reboot mitigation and is marginal at this
#   resolution. For headroom, add `cma=512M` to /boot/firmware/cmdline.txt
#   (single line, space separated) and reboot. The binned modes such as
#   pi_camera_1920x1080.yaml (~6 MiB/buffer) fit in the 64 MiB default and are
#   unaffected.
